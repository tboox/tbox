name: Solaris

on:
  pull_request:
  push:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest

    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Solaris
        cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Tests
        id: test
        uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          prepare: |
            pkgutil -y -i socat git gmake bash gcc4g++ || pkgutil -y -i socat git gmake bash gcc5g++ || pkg install -y developer/gcc || true
          run: |
            cd $GITHUB_WORKSPACE
            bash ./configure
            echo "=== tbox.config.h content ==="
            find build -name "tbox.config.h" -type f | head -1 | xargs cat || echo "tbox.config.h not found"
            echo "============================"
            gmake -j4
            gmake run

